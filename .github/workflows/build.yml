name: Build Windows App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SmartMoneyAnalyzer main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartMoneyAnalyzer-Windows
          path: dist/SmartMoneyAnalyzer.exe
